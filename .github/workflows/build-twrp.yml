name: Build TWRP 14.1 for Redmi 9 (lancelot)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p ~/.local/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Remove Extra Bloat Before Disk Expansion
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/share/powershell /usr/local/share/chromium /usr/local/julia* /usr/local/lib/node_modules || true
          df -h

      - name: Maximize Build Space & Swap
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Verify Disk & Memory
        run: |
          df -h
          free -h

      - name: Configure Git
        run: |
          git config --global user.name "TWRP Builder"
          git config --global user.email "builder@users.noreply.github.com"
          git config --global color.ui false

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: twrp_device_tree

      - name: Sync TWRP 14.1 Minimal Manifest
        run: |
          BUILD_ROOT="$GITHUB_WORKSPACE/twrp"
          echo "BUILD_ROOT=$BUILD_ROOT" >> $GITHUB_ENV
          mkdir -p "$BUILD_ROOT"
          cd "$BUILD_ROOT"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
          repo sync -c --no-clone-bundle --no-tags --no-repo-verify --optimized-fetch --prune -j$(nproc --all)
          rm -rf "$BUILD_ROOT/.repo"
          df -h

      - name: Copy Device Tree into Build Workspace
        run: |
          mkdir -p "$BUILD_ROOT/device/xiaomi/lancelot"
          rsync -av --exclude='.git' --exclude='.github' "$GITHUB_WORKSPACE/twrp_device_tree/" "$BUILD_ROOT/device/xiaomi/lancelot/"

      - name: Build TWRP Recovery Image
        run: |
          cd "$BUILD_ROOT"
          export ALLOW_MISSING_DEPENDENCIES=true
          set +u
          source build/envsetup.sh
          REL="ap2a"
          if [ ! -f "build/release/build_config/${REL}.scl" ]; then
            REL=$(ls build/release/build_config/*.scl 2>/dev/null | head -n1 | xargs -r basename -s .scl || true)
            [ -z "$REL" ] && REL="trunk_staging"
          fi
          echo "Using TARGET_RELEASE=$REL"
          lunch "twrp_lancelot-${REL}-eng"
          mka recoveryimage -j3

      - name: Check Output Size
        run: |
          ls -lh "$BUILD_ROOT/out/target/product/lancelot/recovery.img"
          df -h

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-lancelot-a15-14.1
          path: |
            ${{ env.BUILD_ROOT }}/out/target/product/lancelot/recovery.img
            ${{ env.BUILD_ROOT }}/out/target/product/lancelot/recovery.img.sha256sum
          if-no-files-found: warn
          retention-days: 30
