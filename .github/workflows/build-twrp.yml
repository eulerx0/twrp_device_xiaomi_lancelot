name: Build TWRP 12.1 (Android 15 Compatible) for Redmi 9 (lancelot)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free Disk Space & Configure Swap on /mnt
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/julia* \
            /usr/local/lib/node_modules \
            /usr/share/miniconda \
            /usr/local/aws-cli \
            /usr/local/share/boost || true
          sudo docker image prune -a -f || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          MNT_AVAIL_MB=$(df -BM --output=avail /mnt | tail -n1 | tr -dc '0-9')
          SWAP_MB=$((MNT_AVAIL_MB - 1024))
          if [ "$SWAP_MB" -gt 12288 ]; then SWAP_MB=12288; fi
          echo "Allocating ${SWAP_MB}M swap on /mnt/swapfile (avail ${MNT_AVAIL_MB}M)"
          sudo fallocate -l "${SWAP_MB}M" /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count="$SWAP_MB"
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h
          free -h

      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p ~/.local/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config --global user.name "TWRP Builder"
          git config --global user.email "builder@users.noreply.github.com"
          git config --global color.ui false

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: twrp_device_tree

      - name: Sync TWRP 12.1 Minimal Manifest & Prune Git Metadata
        run: |
          BUILD_ROOT="/home/runner/twrp"
          echo "BUILD_ROOT=$BUILD_ROOT" >> $GITHUB_ENV
          mkdir -p "$BUILD_ROOT"
          cd "$BUILD_ROOT"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)
          rm -rf "$BUILD_ROOT/.repo"
          find "$BUILD_ROOT" -name ".git" -prune -exec rm -rf {} +
          df -h

      - name: Copy Device Tree into Build Workspace
        run: |
          mkdir -p "$BUILD_ROOT/device/xiaomi/lancelot"
          rsync -av --exclude='.git' --exclude='.github' "$GITHUB_WORKSPACE/twrp_device_tree/" "$BUILD_ROOT/device/xiaomi/lancelot/"

      - name: Build TWRP Recovery Image
        run: |
          cd "$BUILD_ROOT"
          export ALLOW_MISSING_DEPENDENCIES=true
          export GOGC=20
          export GOMEMLIMIT=10GiB
          set +u
          source build/envsetup.sh
          lunch twrp_lancelot-eng
          mka recoveryimage -j3

      - name: Check Output Size
        run: |
          ls -lh "$BUILD_ROOT/out/target/product/lancelot/recovery.img"
          sha256sum "$BUILD_ROOT/out/target/product/lancelot/recovery.img" > "$BUILD_ROOT/out/target/product/lancelot/recovery.img.sha256sum"
          cat "$BUILD_ROOT/out/target/product/lancelot/recovery.img.sha256sum"
          df -h

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-lancelot-a15-twrp12.1
          path: |
            ${{ env.BUILD_ROOT }}/out/target/product/lancelot/recovery.img
            ${{ env.BUILD_ROOT }}/out/target/product/lancelot/recovery.img.sha256sum
          if-no-files-found: warn
          retention-days: 30
